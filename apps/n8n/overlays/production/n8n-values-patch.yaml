apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  values:
    main:
      count: 3
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "800m"
        memory: "512Mi"
    externalPostgresql:
      host: postgres-db-rw
      port: 5432
      username: n8n-db-user-prod
      password: some-password
      database: n8n-prod-db
    ingress:
      hosts:
        - host: n8n.local
          paths:
            - path: /
              pathType: Prefix

      tls:
        - secretName: tls-production-secret
        - hosts:
            - n8n.local

