apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  values:
    main:
      count: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    externalPostgresql:
      host: postgres-example-rw
      port: 5432
      username: n8n-db-user-staging
      password: n8n-db-pwd-staging
      database: n8n-staging-db
