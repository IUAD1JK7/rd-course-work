apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 5m
  chart:
    spec:
      chart: n8n
      version: "1.16.8"  
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: n8nio/n8n
      tag: latest
      pullPolicy: IfNotPresent

    main:
      count: 1

      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    db:
      type: postgresdb

    externalPostgresql:
      host: placeholder
      port: placeholder
      username: placeholder
      password: placeholder
      database: placeholder

    readinessProbe:
       httpGet:
          path: /healthz
          port: 5678
       initialDelaySeconds: 5
       periodSeconds: 5
  
    service:
      type: ClusterIP
      port: 5678

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "64m"
      hosts:
        - host: n8n.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: n8n-tls
          hosts:
            - n8n.example.com

